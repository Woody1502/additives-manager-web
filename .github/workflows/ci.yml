name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Run tests
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7

  build-frontend:
    name: Build Windows exe
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('frontend/**/*.csproj') }}
          restore-keys: nuget-

      - name: Build Windows exe
        run: |
          cd frontend
          dotnet publish RecipeApp.WinForms/RecipeApp.WinForms.csproj \
            -r win-x64 \
            -c Release \
            -p:PublishSingleFile=true \
            --self-contained true \
            -o artifact

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: additives-manager-frontend-win-x64
          path: frontend/artifact/RecipeApp.WinForms.exe
          retention-days: 30
